name: vitality
description: ManyBoost — Gamified Screen Time Tracker with Reward-to-Earn
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # Secure storage
  flutter_secure_storage: ^9.2.0
  shared_preferences: ^2.3.0

  # UI
  google_fonts: ^6.1.0
  intl: ^0.19.0
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  confetti: ^0.7.0
  percent_indicator: ^4.2.3
  cached_network_image: ^3.3.1
  flutter_staggered_animations: ^1.1.1

  # Ads
  google_mobile_ads: ^5.3.0

  # Utils
  share_plus: ^10.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
