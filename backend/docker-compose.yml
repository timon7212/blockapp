services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      POSTGRES_USER: manyboost
      POSTGRES_PASSWORD: manyboost
      POSTGRES_DB: manyboost
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manyboost"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env

volumes:
  pgdata:
